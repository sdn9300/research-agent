[project]
name = "careerhelm-core-engine"
version = "1.0.0"
description = "CareerHelm Autonomous Scheduled Loop & Core Discovery Subsystems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
mcp = [
    "fastmcp>=0.1.0",
]
ui = [
    "streamlit>=1.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
