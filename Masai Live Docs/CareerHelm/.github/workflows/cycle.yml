name: Daily Autonomous EdgeDash Cycle

on:
  schedule:
    # 06:00 IST (Indian Standard Time, UTC+5:30) is 00:30 UTC every day
    # Daily at 00:30 UTC == 06:00 AM IST
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m edgedash.storage --migrate
          python -m edgedash.storage --check

      - name: Execute autonomous cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_cycle.py

      - name: Run system health report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m edgedash.health

      - name: Upload cycle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-logs
          path: |
            *.log
            edgedash.db
          retention-days: 7
