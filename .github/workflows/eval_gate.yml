name: Gate 3 Evaluation

on:
  push:
    branches:
      - main
      - master
    paths:
      - "graph/**"
      - "eval/**"
      - "schemas/**"
      - "pipeline/**"
      - "observability/**"
      - ".github/workflows/eval_gate.yml"
  pull_request:
    paths:
      - "graph/**"
      - "eval/**"
      - "schemas/**"
      - "pipeline/**"
      - "observability/**"
      - ".github/workflows/eval_gate.yml"
  workflow_dispatch:

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run Evaluation Gate
        run: python eval/run_eval.py --ci
